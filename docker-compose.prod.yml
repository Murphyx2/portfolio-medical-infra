# Production stack: hardened settings, gunicorn, built images (no bind mounts),
# Redis with password, and no public exposure of DB/Redis.
name: medicalconsultations-prod

services:
  db:
    image: postgres:16-alpine
    container_name: mc_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7-alpine
    container_name: mc_prod_cache
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../backend
    container_name: mc_prod_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "false"
      # No TLS terminator in this stack yet; terminate at a proxy in real deploys.
      DJANGO_SECURE_SSL_REDIRECT: "false"
      POSTGRES_HOST: db
      REDIS_URL: redis://:${REDIS_PASSWORD}@cache:6379/0
    volumes:
      - media_volume:/app/media
    expose:
      - "8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    container_name: mc_prod_frontend
    restart: unless-stopped
    volumes:
      - media_volume:/media:ro
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  media_volume:
