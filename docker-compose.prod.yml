# Production overlay — merged over docker-compose.yml.
# Usage: `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d`
# Hardened settings, gunicorn, built images (no bind mounts), Redis with password,
# TLS via nginx + cert-init, and no public exposure of DB/Redis.
name: medicalconsultations-prod

services:
  db:
    container_name: mc_prod_db

  cache:
    container_name: mc_prod_cache
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    container_name: mc_prod_backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "false"
      DJANGO_SECURE_SSL_REDIRECT: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD}@cache:6379/0
    expose:
      - "8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  cert-init:
    image: alpine:3.20
    container_name: mc_prod_cert_init
    restart: "no"
    command: >
      sh -c "apk add --no-cache openssl &&
             mkdir -p /certs &&
             [ -f /certs/server.key ] ||
             openssl req -x509 -nodes -newkey rsa:2048 -days 3650 \
               -keyout /certs/server.key -out /certs/server.crt \
               -subj '/CN=medicalconsultations.local'"
    volumes:
      - certs:/certs

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    container_name: mc_prod_frontend
    volumes:
      - certs:/etc/nginx/certs:ro
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - backend
      - cert-init

volumes:
  certs: